<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GMPI ASN Portal — QR Code</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:32px}
.card{border:2px solid #C9A84C;border-radius:16px;padding:36px 48px;text-align:center;max-width:420px;width:100%}
.logo{font-size:13px;font-weight:700;letter-spacing:3px;color:#C9A84C;margin-bottom:4px}
h1{font-size:22px;font-weight:800;color:#0A0705;margin-bottom:4px}
.sub{font-size:12px;color:#888;margin-bottom:24px}
.qr-wrap{display:inline-block;padding:14px;border:1px solid #eee;border-radius:10px;margin-bottom:16px}
.qr-wrap img{display:block;width:220px;height:220px}
.url{font-size:10px;color:#aaa;word-break:break-all;margin-bottom:8px;font-family:monospace}
.hint{font-size:11px;color:#aaa;margin-top:20px}
@media print{
  body{padding:0;min-height:auto}
  .card{border:2px solid #C9A84C;page-break-inside:avoid}
  .no-print{display:none}
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">GMPI</div>
  <h1>ASN Portal</h1>
  <div class="sub">Delivery Management System · Scan to open</div>
  <div class="qr-wrap">
    <img id="qr-img" alt="QR Code loading...">
  </div>
  <div class="url">https://script.google.com/macros/s/<br>AKfycbzqDYfrD4aHx4rjWuXcVQI6OiZwI6c5P_1I-x-4wy3aXNuuR2LWFmiyXMyYsS8jUXBk/exec</div>
  <div class="hint no-print">💡 Press Ctrl+P to print · Scan with any phone camera</div>
  <button class="no-print" onclick="window.print()" style="margin-top:16px;padding:8px 24px;border:1px solid #C9A84C;background:#fff;color:#C9A84C;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer">🖨 Print</button>
</div>

<script>
var url='https://script.google.com/macros/s/AKfycbzqDYfrD4aHx4rjWuXcVQI6OiZwI6c5P_1I-x-4wy3aXNuuR2LWFmiyXMyYsS8jUXBk/exec';
var encoded=encodeURIComponent(url);
document.getElementById('qr-img').src='https://chart.googleapis.com/chart?cht=qr&chs=220x220&chl='+encoded+'&choe=UTF-8&chld=M|1';
</script>
</body>
</html>
